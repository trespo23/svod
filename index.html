<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@700&display=swap">
<style>
/* Layout: one phone-width column, floating tab bar, bottom sheets for editing. */
:root{--bg:#F1F2EC;--card:#FFFFFF;--line:#E2E5DC;--line2:#C7CCBF;--tx:#101214;--mu:#5A625B;--ac:#A4D420;--at:#4A6100;--on:#101214;--nav:#101214;--navtx:#A8AFA8;--navac:#C8F04B;--seg:#E4E7DE;--danger:#B3261E;--scrim:rgba(16,18,20,.45);
--display:'Unbounded','Arial Black',system-ui,sans-serif;--body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1012;--card:#181B1E;--line:#262A2E;--line2:#363B41;--tx:#F4F6F1;--mu:#98A099;--ac:#C8F04B;--at:#C8F04B;--nav:#1D2024;--navtx:#98A099;--seg:#2B3035;--danger:#F2847C;--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1012;--card:#181B1E;--line:#262A2E;--line2:#363B41;--tx:#F4F6F1;--mu:#98A099;--ac:#C8F04B;--at:#C8F04B;--nav:#1D2024;--navtx:#98A099;--seg:#2B3035;--danger:#F2847C;--scrim:rgba(0,0,0,.6);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
select.pill{font-size:16px}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--body);font-size:15px;line-height:1.35}
#scroll{position:fixed;top:0;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:env(safe-area-inset-top,0px) 16px 0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--at);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding-block:20px calc(120px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.3px;margin:0;line-height:1.2}
h2{font-size:16px;font-weight:700;margin:0}
.mu{color:var(--mu)}.sm{font-size:13px}.at{color:var(--at)}
.head{display:flex;align-items:center;gap:12px}
.head .grow{flex:1;min-width:0}
.mark{position:relative;flex:none;width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center}
.mark:before{content:"";position:absolute;left:7.5px;top:7.2px;width:19px;height:17.5px;border:4.25px solid var(--tx);border-bottom:0;border-radius:9.5px 9.5px 0 0}
.mark:after{content:"";position:absolute;left:14.5px;top:18px;width:5px;height:5px;border-radius:50%;background:var(--ac)}
.ib{flex:none;width:44px;height:44px;border-radius:22px;border:1px solid var(--line2);background:none;display:flex;align-items:center;justify-content:center;position:relative}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--ac);color:var(--on);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px}
.pad{padding:16px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.week button{border:0;background:none;border-radius:14px;padding:6px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px}
.week button.sel{background:var(--card);box-shadow:inset 0 0 0 1px var(--line2)}
.week b{font-size:16px}.week i{width:7px;height:7px;border-radius:50%}
.week .today i{background:var(--ac)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.seg button{height:42px;border:0;border-radius:12px;background:none;color:var(--mu);font-weight:600;font-size:14px}
.seg button.on{background:var(--seg);color:var(--tx);font-weight:700}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.row{display:flex;align-items:center;gap:4px;padding:4px 12px 4px 4px;min-height:54px}
.row+.row{border-top:1px solid var(--line)}
.chk{flex:none;width:44px;height:44px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center}
.chk span{width:22px;height:22px;border-radius:7px;border:2px solid var(--mu);display:flex;align-items:center;justify-content:center}
.chk.on span{background:var(--ac);border-color:var(--ac)}
.chk.on span:after{content:"";width:10px;height:5px;border-left:2.5px solid var(--on);border-bottom:2.5px solid var(--on);transform:rotate(-45deg) translate(1px,-1px)}
.tt{flex:1;min-width:0;border:0;background:none;text-align:left;padding:6px 0}
.tt b{display:block;font-weight:600;overflow-wrap:anywhere}
.done .tt b{color:var(--mu);text-decoration:line-through}
.dot{flex:none;width:10px;height:10px;border-radius:50%}
.pill{height:36px;padding:0 12px;border-radius:12px;border:1px solid var(--line2);background:none;font-size:13px;font-weight:600;max-width:46%}
.btn{height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line2);background:none;font-weight:600}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:700}
.btn.wide{width:100%}.btn.dash{border-style:dashed}.btn.warn{color:var(--danger);border-color:var(--danger)}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;border:1px dashed var(--line2);background:var(--card);width:100%;text-align:left}
.empty{padding:22px 16px;text-align:center;color:var(--mu)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;row-gap:2px}
.cal .dw{font-size:12px;color:var(--mu);padding-bottom:4px}
.cal button{border:0;background:none;height:48px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.cal button b{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:500;font-variant-numeric:tabular-nums}
.cal button.sel b{background:var(--ac);color:var(--on);font-weight:700}
.cal button.today b{box-shadow:inset 0 0 0 1.5px var(--at)}
.cal .dots{height:6px;display:flex;gap:3px}.cal .dots i{width:6px;height:6px;border-radius:50%}
.goal{display:flex;gap:14px;align-items:center}
.ring{flex:none;width:68px;height:68px;position:relative}
.ring svg{width:68px;height:68px;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mu)}
.fld input,.fld select,.fld textarea,.inp{height:48px;border-radius:14px;border:1px solid var(--line2);background:var(--bg);color:var(--tx);padding:0 14px;font-size:16px;width:100%;min-width:0}
.fld textarea{height:110px;padding:12px 14px;font-size:16px;font-family:ui-monospace,Menlo,monospace}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.line{display:flex;gap:8px;align-items:center}.line .inp{flex:1}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;padding:0 16px}
.set+.set{border-top:1px solid var(--line)}
.set input[type=color]{width:44px;height:32px;border:0;background:none;padding:0}
#nav{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:5}
#nav div{pointer-events:auto;max-width:520px;margin:0 auto;height:72px;border-radius:28px;background:var(--nav);border:1px solid var(--line2);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center}
#nav button{border:0;background:none;color:var(--navtx);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;height:60px;justify-content:center}
#nav button.on{color:var(--navac)}
#nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav .plus{justify-self:center;width:56px;height:56px;border-radius:28px;background:var(--navac);color:#101214}
#sheet{position:fixed;inset:0;background:var(--scrim);z-index:10;display:flex;align-items:flex-end;justify-content:center}
#sheet .box{width:100%;max-width:520px;max-height:92%;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line2);background:none;font-weight:600;font-size:14px}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
#splash{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;animation:sp-out .35s 1.7s ease-in forwards}
#splash .st{position:relative;width:160px;height:160px}
#splash .ar{position:absolute;left:-25.6px;top:-28.1px;width:211.2px;height:199.2px;border:48px solid var(--tx);border-bottom:0;border-radius:105.6px 105.6px 0 0;transform:scale(.4167);opacity:0;animation:sp-ar 1.7s cubic-bezier(.6,0,.2,1) forwards}
#splash .dt{position:absolute;left:32px;top:41px;width:96px;height:96px;border-radius:50%;background:var(--ac);transform:scale(.229);opacity:0;animation:sp-dt 1.7s cubic-bezier(.6,0,.2,1) forwards}
#splash .hf{position:absolute;inset:0;border-radius:50%;background:conic-gradient(transparent 0 180deg,var(--tx) 180deg 360deg);opacity:0;animation:sp-hf 1.7s forwards}
#splash .hl{position:absolute;inset:22%;border-radius:50%;background:var(--bg);transform:scale(0);animation:sp-hl 1.7s forwards}
@keyframes sp-ar{0%{opacity:0;transform:scale(.4167)}15%,35%{opacity:1;transform:scale(.4167)}65%,100%{opacity:0;transform:scale(1)}}
@keyframes sp-dt{0%{opacity:0;transform:scale(.229)}15%,35%{opacity:1;transform:scale(.229)}70%,100%{opacity:1;transform:translateY(-9px) scale(1)}}
@keyframes sp-hf{0%,70%{opacity:0}90%,100%{opacity:1}}
@keyframes sp-hl{0%,62%{transform:scale(0)}85%,100%{transform:scale(1)}}
@keyframes sp-out{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion: reduce){#splash{display:none}}
</style>

<script>
(function(){
var KEY='svod.state.v1', DOW=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'], DOWF=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'],
MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'],
MONN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'],
ST={doing:'В работе',plan:'Планы',wait:'Жду',done:'Готово'}, KIND={inbox:'Отсортировать',work:'Работа',personal:'Личное',goal:'К цели'};
var pad=function(n){return String(n).padStart(2,'0')};
var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parse=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
var addD=function(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
var TODAY=iso(new Date());
var human=function(s){var d=parse(s);return DOWF[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]};
var short=function(s){var d=parse(s);return d.getDate()+' '+MON[d.getMonth()].slice(0,3)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)};
var SPH=[{id:'work',name:'Работа',color:'#7FB2F0'},{id:'sport',name:'Спорт',color:'#F2A65A'},{id:'goals',name:'Цели',color:'#B4DC3C'},{id:'content',name:'Контент',color:'#C3A6F5'},{id:'home',name:'Дом',color:'#6FD0C0'}];
function blank(){return{tasks:[],goals:[],spheres:JSON.parse(JSON.stringify(SPH)),settings:{theme:'system',view:'blocks'},demo:false,updatedAt:0}}
function demo(){var s=blank(),T=TODAY,g1=uid(),g2=uid();s.demo=true;
s.goals=[{id:g1,title:'Запустить приложение бюджета',type:'steps',due:addD(T,24)},{id:g2,title:'Регулярный спорт',type:'habit',target:4,count:2}];
var t=function(o){o.id=uid();o.status=o.status||'plan';s.tasks.push(o)};
t({title:'Сценарии и структура',kind:'goal',goalId:g1,status:'done'});
t({title:'Основные экраны',kind:'goal',goalId:g1,status:'done'});
t({title:'Проверить сборку',kind:'goal',goalId:g1,status:'doing',date:T,time:'19:00',dur:60,due:addD(T,2)});
t({title:'Подготовить описание',kind:'goal',goalId:g1,dur:20});
t({title:'Проверить мокап UB2',kind:'work',status:'doing',date:T,time:'14:00',dur:45,due:T});
t({title:'Согласовать наполнение',kind:'work',status:'doing',due:addD(T,2)});
t({title:'Отправить ТЗ игровой',kind:'work',due:addD(T,2)});
t({title:'Подготовить ассеты',kind:'work',status:'wait',due:addD(T,5)});
t({title:'Хоккей',kind:'personal',sphere:'sport',status:'done',date:T,time:'07:00',dur:90});
t({title:'Записаться в зал',kind:'personal',sphere:'sport'});
t({title:'Идея ролика для YouTube',kind:'inbox'});
t({title:'Позвонить по игровой комнате',kind:'inbox'});
return s}
var S, db=null, ui={tab:'today',day:TODAY,month:TODAY.slice(0,7),planKind:'work',sheet:null,edit:null,cap:{},confirm:null,openGoal:null,store:'device'};
function loadLocal(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.tasks)return o}}catch(e){}return null}
var pushT=null;
function save(){S.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
 if(db){clearTimeout(pushT);pushT=setTimeout(function(){db.doc('svod/state').set({json:JSON.stringify(S),updatedAt:S.updatedAt}).catch(function(){})},700)}}
function applyTheme(){var t=S.settings.theme,r=document.documentElement;if(t==='light'||t==='dark')r.setAttribute('data-theme',t);else r.removeAttribute('data-theme')}
function sph(id){for(var i=0;i<S.spheres.length;i++)if(S.spheres[i].id===id)return S.spheres[i];return S.spheres[0]}
function color(t){return sph(t.kind==='work'?'work':t.kind==='goal'?'goals':(t.sphere||'home')).color}
function goal(id){return S.goals.filter(function(g){return g.id===id})[0]}
function onDay(d){return S.tasks.filter(function(t){return t.kind!=='inbox'&&(t.date===d||(!t.date&&t.due===d))}).sort(function(a,b){return(a.time||'99')<(b.time||'99')?-1:1})}
function inbox(){return S.tasks.filter(function(t){return t.kind==='inbox'})}
function gProg(g){if(g.type==='habit')return{a:g.count||0,b:g.target||1};var st=S.tasks.filter(function(t){return t.goalId===g.id});return{a:st.filter(function(t){return t.status==='done'}).length,b:st.length}}
var IC={gear:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',inbox:'<path d="M4 13l2-8h12l2 8v6H4z"/><path d="M4 13h5a3 3 0 0 0 6 0h5"/>',home:'<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',plus:'<path d="M12 5v14M5 12h14"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',back:'<path d="M15 6l-6 6 6 6"/>',l:'<path d="M15 6l-6 6 6 6"/>',r:'<path d="M9 6l6 6-6 6"/>'};
var ico=function(n){return'<svg viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>'};
function meta(t){var m=[];if(t.time)m.push(t.time);if(t.dur)m.push(t.dur+' мин');if(t.due)m.push('срок '+(t.due===TODAY?'сегодня':short(t.due)));if(t.kind==='goal'&&goal(t.goalId))m.push(goal(t.goalId).title);return m.join(' · ')}
function row(t,extra){var m=meta(t);return'<div class="row'+(t.status==='done'?' done':'')+'"><button class="chk'+(t.status==='done'?' on':'')+'" data-act="toggle" data-id="'+t.id+'" aria-label="Отметить: '+esc(t.title)+'"><span></span></button><button class="tt" data-act="edit" data-id="'+t.id+'"><b>'+esc(t.title)+'</b>'+(m?'<span class="sm mu">'+esc(m)+'</span>':'')+'</button>'+(extra||'<i class="dot" style="background:'+color(t)+'"></i>')+'</div>'}
function list(ts,empty){return ts.length?'<div class="card">'+ts.map(function(t){return row(t)}).join('')+'</div>':(empty?'<div class="card empty">'+empty+'</div>':'')}
function head(title,sub,back){var n=inbox().length;return'<div class="head">'+(back?'<button class="ib" data-act="tab" data-tab="'+back+'" aria-label="Назад">'+ico('back')+'</button>':'<span class="mark" aria-hidden="true"></span>')+'<div class="grow"><h1>'+title+'</h1>'+(sub?'<div class="mu">'+sub+'</div>':'')+'</div>'+(back?'':'<button class="ib" data-act="tab" data-tab="inbox" aria-label="Отсортировать: '+n+'">'+ico('inbox')+(n?'<span class="badge">'+n+'</span>':'')+'</button><button class="ib" data-act="tab" data-tab="settings" aria-label="Настройки">'+ico('gear')+'</button>')+'</div>'}
function demoNote(){return S.demo?'<div class="banner sm"><span class="grow" style="flex:1">Сейчас показаны <b>демо-данные</b>. Очистите их, когда начнёте вести свои дела.</span><button class="pill" data-act="clear">'+(ui.confirm==='clear'?'Точно очистить?':'Очистить')+'</button></div>':''}
function vToday(){var d=parse(ui.day),mon=addD(ui.day,-((d.getDay()+6)%7)),w='';for(var i=0;i<7;i++){var x=addD(mon,i);w+='<button class="'+(x===ui.day?'sel ':'')+(x===TODAY?'today':'')+'" data-act="day" data-d="'+x+'"><span class="sm mu">'+DOW[parse(x).getDay()]+'</span><b>'+parse(x).getDate()+'</b><i></i></button>'}
 var ts=onDay(ui.day),n=inbox().length,doneN=ts.filter(function(t){return t.status==='done'}).length,body;
 if(S.settings.view==='time')body=list(ts,'На этот день ничего не запланировано. Нажмите «+», чтобы записать дело.');
